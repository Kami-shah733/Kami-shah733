name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"   # har 6 ghante update
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#00ff41&color_dots=#0d1117,#003b1a,#006d32,#26a641,#39d353
            dist/snake-dark.svg?palette=github-dark&color_snake=#00ff41&color_dots=#161b22,#003b1a,#006d32,#26a641,#39d353&color_background=#0d1117

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
